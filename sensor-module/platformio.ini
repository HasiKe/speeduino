; Hayabusa sensor module, hardware revision 3.
; STM32G474RBT6, 4x MAX31855K thermocouple front end, 8 analog channels,
; intercooler fan output and a classic CAN link to the Speeduino ECU.

[env:sensor_module]
platform = ststm32
board = hayabusa_sm_g474rb
framework = stm32cube
build_flags =
    -Iinclude
    -Wall
    -Wextra
    -Werror
    -Og
    -g3
build_unflags = -Os
upload_protocol = stlink
debug_tool = stlink
monitor_speed = 115200

; Release build: same firmware, optimised for size.
[env:sensor_module_release]
extends = env:sensor_module
build_flags =
    ${env:sensor_module.build_flags}
    -DNDEBUG
    -Os
build_unflags = -Og -g3
